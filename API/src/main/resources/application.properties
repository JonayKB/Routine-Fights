spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=http://localhost/
spring.graphql.cors.allowed-methods=GET,POST
spring.graphql.cors.max-age=1800s
spring.security.user.name=admin
spring.security.user.password=admin
spring.graphql.schema.printer.enabled=true
# Subscriptions (chat, live notifications). Authenticated in WebSocketAuthInterceptor.
spring.graphql.websocket.path=/graphql-ws
spring.graphql.websocket.connection-init-timeout=30s
spring.graphql.websocket.keep-alive=25s
sendgrid.from-name=Routine Fights

logging.level.org.springframework.data.neo4j.cypher.unrecognized=ERROR
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1



spring.application.name=RoutineFights
# Variables de entorno (se configuran en Docker o GitHub)
spring.neo4j.uri=${SPRING_NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

spring.sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=routinefights@gmail.com

# SSL (Rutas del contenedor)
# HTTPS terminates at nginx (administration/nginx.conf); inside the Docker
# network the API speaks plain HTTP. Set SERVER_SSL_ENABLED=true to serve
# HTTPS directly.
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.certificate=/etc/letsencrypt/live/routinefights.jonaykb.com/fullchain.pem
server.ssl.certificate-private-key=/etc/letsencrypt/live/routinefights.jonaykb.com/privkey.pem

# Public URL of the site (links in e-mails).
app.public-url=${APP_PUBLIC_URL:https://routinefights.jonaykb.com}

# Firebase (Ruta absoluta dentro del contenedor)
firebase.service-account=file:/app/secrets/firebase-adminsdk.json