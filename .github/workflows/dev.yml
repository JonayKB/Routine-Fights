name: CI SonarQube Analysis DEV

on:
  push:
    # The mobile app has its own workflow (mobile.yml); app-only commits
    # should not rebuild and redeploy the backend.
    paths-ignore:
      - "App/**"
      - ".github/workflows/mobile.yml"


jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Reconstruir archivos secretos
        # Secrets go through env vars: pasting them into the script breaks on
        # quotes and exposes them to shell interpretation.
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          DEEPL_KEY_CONTENT: ${{ secrets.DEEPL_KEY_CONTENT }}
          APPLICATION_PROPERTIES_PROD: ${{ secrets.APPLICATION_PROPERTIES_PROD }}
        run: |
          KEYSTORE=API/src/main/java/es/iespuertodelacruz/routinefights/resources/keystore
          mkdir -p "$KEYSTORE"
          printf '%s' "$FIREBASE_JSON" > "$KEYSTORE/routinefights-1-firebase-adminsdk-fbsvc-a9082c7c49.json"
          printf '%s' "$P12_BASE64" | base64 -d > "$KEYSTORE/routinefights.p12"
          # DeeplService reads "keystore/deeplKey" from the classpath (src/main/resources).
          mkdir -p API/src/main/resources/keystore
          printf '%s\n' "$DEEPL_KEY_CONTENT" > API/src/main/resources/keystore/deeplKey
          printf '%s\n' "$APPLICATION_PROPERTIES_PROD" > API/src/main/resources/application.properties
      - name: Compilar y ejecutar tests con Maven
        working-directory: API
        run: mvn verify

      - name: Ejecutar análisis en SonarQube
        working-directory: API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
          BRANCH_NAME: ${{ github.ref_name }}
          HOSTNAME: ${{ vars.HOSTING_PC }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=RoutineFights \
            -Dsonar.host.url=http://$HOSTNAME:9000 \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true  \
            -Dsonar.branch.name=$BRANCH_NAME
      - name: Save Maven build output
        if: success() && ${{ github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: API/target/*.jar

  build:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    strategy:
      matrix:
        include:
        - name: API
          slug: api
          component: API
        - name: administration
          slug: administration
          component: administration
    steps:
      - uses: actions/checkout@v4

      - name: Create TIMESTAMP
        run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
      
      - name: Download Maven artifact
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: API/target
      
      - uses: docker/setup-buildx-action@v2
      
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
     
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.slug }}routinefights:latest,
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.slug }}routinefights:${{ env.TIMESTAMP }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    steps:
    - name: Deploy to digitalocean
      uses: appleboy/ssh-action@v0.1.7
      with:
        username: ${{ vars.HOSTING_USERNAME }}
        host: ${{ vars.HOSTING_PC }}
        password: ${{ secrets.HOSTING_PASSWORD }}
        script: |
            docker compose down;
            docker compose pull
            docker image prune -f
            docker compose up -d
