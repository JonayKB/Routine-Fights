# Admin panel + API router, running behind the host's nginx.
#
# The host nginx (deploy/nginx/routinefights.jonaykb.com.conf) terminates
# HTTPS for https://routinefights.jonaykb.com and forwards everything to this
# container, published only on 127.0.0.1:8023. Here:
#   - /graphql, /images/ and /auth/verify/ go to the API ("app" on apiNetwork)
#   - everything else is the React admin panel.

# Keep the scheme the client used (https) when the host nginx tells us.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  # Resolve "app" through Docker's DNS at request time, so nginx still starts
  # (and recovers) when the API container is down or gets a new IP.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://app:8080;

  # Photos uploaded from the app.
  client_max_body_size 25m;

  # ---------- API ----------

  location = /graphql {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
  }

  # ^~ so these prefixes win over the static-file regex below
  # (otherwise /images/photo.png would be served by the panel).
  location ^~ /images/ {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
    proxy_request_buffering off;
  }

  location ^~ /auth/verify/ {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
  }

  # ---------- Admin panel (React) ----------

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
