# Single entry point for https://routinefights.jonaykb.com:
#   - serves the admin panel (React)
#   - proxies the API used by the mobile app and the panel
#     (/graphql, /images/, /auth/verify/) to the "app" container.
# HTTPS terminates here; inside the Docker network the API speaks plain HTTP.

# Port 80: Let's Encrypt HTTP-01 challenges, everything else goes to HTTPS.
server {
  listen 80;
  server_name routinefights.jonaykb.com;

  # certbot certonly --webroot -w /var/www/certbot -d routinefights.jonaykb.com
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name routinefights.jonaykb.com;

  ssl_certificate     /etc/letsencrypt/live/routinefights.jonaykb.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/routinefights.jonaykb.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Resolve "app" through Docker's DNS at request time, so nginx still starts
  # (and recovers) when the API container is down or gets a new IP.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://app:8080;

  # Photos uploaded from the app.
  client_max_body_size 25m;

  # ---------- API ----------

  location = /graphql {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
  }

  # ^~ so these prefixes win over the static-file regex below
  # (otherwise /images/photo.png would be served by the panel).
  location ^~ /images/ {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
    proxy_request_buffering off;
  }

  location ^~ /auth/verify/ {
    proxy_pass $api_upstream;
    include /etc/nginx/conf.d/api-proxy.inc;
  }

  # ---------- Admin panel (React) ----------

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
