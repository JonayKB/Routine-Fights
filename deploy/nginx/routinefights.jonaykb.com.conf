# Host nginx site for https://routinefights.jonaykb.com
#
# Install on the server (paths for Debian/Ubuntu-style nginx; on distributions
# that use /etc/nginx/conf.d/, copy it there instead):
#
#   1. First time only, the certificate does not exist yet: install the file
#      WITHOUT the 443 server block, then
#        sudo mkdir -p /var/www/certbot
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot certonly --webroot -w /var/www/certbot \
#          -d routinefights.jonaykb.com --deploy-hook "systemctl reload nginx"
#   2. Add the 443 server block and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# Renewals run through the same webroot and reload nginx via the deploy hook.
#
# HTTPS ends here. Everything is forwarded to the admin container
# (docker-compose: 127.0.0.1:8023), which serves the panel and routes
# /graphql, /images/ and /auth/verify/ to the API.

server {
  listen 80;
  listen [::]:80;
  server_name routinefights.jonaykb.com;

  # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name routinefights.jonaykb.com;

  # Issued by certbot --webroot (see above).
  ssl_certificate     /etc/letsencrypt/live/routinefights.jonaykb.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/routinefights.jonaykb.com/privkey.pem;

  # Photos uploaded from the app.
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8023;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }
}
