# Host nginx site for https://routinefights.jonaykb.com
#
# Install on the server (paths for Debian/Ubuntu-style nginx):
#   sudo cp deploy/nginx/routinefights.jonaykb.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/routinefights.jonaykb.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d routinefights.jonaykb.com   # issues the certificate
#   sudo nginx -t && sudo systemctl reload nginx
# (On distributions that use /etc/nginx/conf.d/, copy it there instead.)
#
# HTTPS ends here. Everything is forwarded to the admin container
# (docker-compose: 127.0.0.1:8023), which serves the panel and routes
# /graphql, /images/ and /auth/verify/ to the API.

server {
  listen 80;
  listen [::]:80;
  server_name routinefights.jonaykb.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name routinefights.jonaykb.com;

  # Written by certbot (see above).
  ssl_certificate     /etc/letsencrypt/live/routinefights.jonaykb.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/routinefights.jonaykb.com/privkey.pem;

  # Photos uploaded from the app.
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8023;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }
}
