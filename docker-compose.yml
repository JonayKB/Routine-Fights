version: '3.3'

services:
  app:
    image: jonaykb/apiroutinefights:latest
    container_name: apiroutinefights
    restart: always
    # Not published: nginx (admin) is the only public entry point and reaches
    # the API as http://app:8080 on apiNetwork.
    expose:
      - "8080"
    environment:
      - SPRING_NEO4J_URI=bolt://db:7687
      - SERVER_SSL_ENABLED=false
      - APP_PUBLIC_URL=https://routinefights.jonaykb.com
      # Token lifetime in ms (30 days)
      - JWT_EXPIRATION=${JWT_EXPIRATION:-2592000000}
      - NEO4J_USER=${NEO4J_USER:?set NEO4J_USER in .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:?set SENDGRID_API_KEY in .env}
      # Firebase Admin SDK service account (push notifications). The JSON is
      # mounted read-only from ./secrets (git-ignored); see .env.example.
      - FIREBASE_SERVICE_ACCOUNT=file:/app/secrets/firebase-adminsdk.json
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-adminsdk.json
    depends_on:
      - db
    networks:
      - apiNetwork
    volumes:
      # The API stores photos in "uploads" under its working directory (/).
      - app_uploads:/uploads
      - ${FIREBASE_CREDENTIALS_FILE:-./secrets/firebase-adminsdk.json}:/app/secrets/firebase-adminsdk.json:ro
  db:
    # Pinned: `docker compose pull` on every deploy used to upgrade Neo4j on its
    # own. A new version may migrate the data files, so upgrading must be a
    # deliberate change here (and older versions may not open them again).
    image: neo4j:2026.10.2
    # Next to this file, not under $HOME: with sudo, $HOME is /root and Neo4j
    # would open a different (empty or stale) database.
    volumes:
        - ./neo4j/logs:/logs
        - ./neo4j/config:/config
        - ./neo4j/data:/data
        - ./neo4j/plugins:/plugins
    environment:
        - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    restart: always
    ports:
      - "7687:7687"
    networks:
      - apiNetwork
  admin:
    image: jonaykb/administrationroutinefights:latest
    restart: always
    # Admin panel + API router (administration/nginx.conf). Published on
    # localhost only: the host nginx terminates HTTPS for
    # https://routinefights.jonaykb.com and forwards here
    # (deploy/nginx/routinefights.jonaykb.com.conf).
    ports:
     - "127.0.0.1:8023:80"
    depends_on:
     - app
    networks:
     - apiNetwork
volumes:
  db_data:
  app_uploads:
networks:
  apiNetwork:

