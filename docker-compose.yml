version: '3.3'

services:
  app:
    image: jonaykb/apiroutinefights:latest
    container_name: apiroutinefights
    restart: always
    ports:
      - "6342:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://db:7687
      - NEO4J_USER=${NEO4J_USER:?set NEO4J_USER in .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:?set SENDGRID_API_KEY in .env}
    depends_on:
      - db
    networks:
      - apiNetwork
    volumes:
      - app_uploads:/$HOME/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
  db:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    environment:
        - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    restart: always
    ports:
      - "7687:7687"
    networks:
      - apiNetwork
  admin:
    image: jonaykb/administrationroutinefights:latest
    restart: always
    ports:
     - "8023:80"
    volumes:
     - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
     - apiNetwork
volumes:
  db_data:
  app_uploads:
networks:
  apiNetwork:

